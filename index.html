<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Science Day GO! - Phase 1</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Leaflet CSS & JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        /* ป้องกันการ Scroll บนมือถือ */
        body { margin: 0; padding: 0; overflow: hidden; }
        #map { height: 100vh; width: 100vw; z-index: 1; }
        .ui-layer { z-index: 1000; }
        /* อนิเมชั่นจุดผู้เล่น */
        .player-pulse {
            background: #3b82f6;
            border-radius: 50%;
            height: 20px;
            width: 20px;
            box-shadow: 0 0 0 rgba(59, 130, 246, 0.4);
            animation: pulse 2s infinite;
            border: 3px solid white;
        }
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(59, 130, 246, 0.7); }
            70% { box-shadow: 0 0 0 20px rgba(59, 130, 246, 0); }
            100% { box-shadow: 0 0 0 0 rgba(59, 130, 246, 0); }
        }
    </style>
</head>
<body class="bg-gray-100 text-gray-800">

    <!-- UI ด้านบน -->
    <div class="ui-layer absolute top-0 w-full bg-white/80 backdrop-blur-sm p-4 shadow-md flex justify-between items-center">
        <div>
            <h1 class="text-xl font-extrabold text-indigo-600 tracking-tight">Science GO!</h1>
            <p class="text-xs text-gray-500 font-medium" id="status-text">กำลังค้นหาสัญญาณ GPS...</p>
        </div>
        <div class="bg-indigo-100 text-indigo-700 px-3 py-1.5 rounded-full text-sm font-bold shadow-inner">
            รัศมีจับ: 15 ม.
        </div>
    </div>

    <!-- แผนที่ -->
    <div id="map"></div>

    <!-- UI ด้านล่าง (ปุ่มจัดการเรดาร์) -->
    <div class="ui-layer absolute bottom-6 w-full flex justify-center px-4">
        <button onclick="centerMapOnPlayer()" class="bg-white p-4 rounded-full shadow-lg border-2 border-indigo-100 hover:bg-indigo-50 active:scale-95 transition-transform">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-indigo-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 11c0 3.517-1.009 6.799-2.753 9.571m-3.44-2.04l.054-.09A13.916 13.916 0 008 11a4 4 0 118 0c0 1.017-.07 2.019-.203 3m-2.118 6.844A21.88 21.88 0 0015.171 17m3.839 1.132c.645-2.266.99-4.659.99-7.132A8 8 0 008 4.07M3 15.364c.64-1.319 1-2.8 1-4.364 0-1.457.39-2.823 1.07-4" />
            </svg>
        </button>
    </div>

    <script>
        // 1. ตั้งค่าพื้นฐานแผนที่
        let map;
        let playerMarker;
        let playerCircle;
        let playerLocation = null;
        const CATCH_RADIUS = 15; // ระยะทางที่อนุญาตให้กดจับได้ (เมตร)

        // พิกัดเริ่มต้น (กรุณาเปลี่ยนเป็นพิกัดลานกว้างโรงเรียนของคุณ)
        // ตัวอย่างนี้คือพิกัดสมมติ
        const SCHOOL_CENTER = [17.40, 104.78]; 

        // 2. กำหนดประเภทไอเทมที่จะเกิด (Emojis แทน Graphic 3D ใน Phase 1)
        const itemTypes = [
            { id: 'chem', icon: '🧪', name: 'ธาตุเคมีปริศนา' },
            { id: 'virus', icon: '🦠', name: 'ไวรัสกลายพันธุ์' },
            { id: 'hardware', icon: '💻', name: 'ชิ้นส่วนเมนบอร์ด' },
            { id: 'tool', icon: '🔭', name: 'กล้องโทรทรรศน์' }
        ];

        // สร้าง Icon ของผู้เล่น
        const playerIcon = L.divIcon({
            html: '<div class="player-pulse"></div>',
            className: '',
            iconSize: [20, 20],
            iconAnchor: [10, 10]
        });

        // 3. เริ่มต้นระบบแผนที่
        function initMap() {
            map = L.map('map', { zoomControl: false }).setView(SCHOOL_CENTER, 18);

            // โหลดแผนที่จาก OpenStreetMap
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                maxZoom: 20,
                attribution: '© OpenStreetMap'
            }).addTo(map);

            // เริ่มติดตาม GPS ผู้เล่น
            startGPS();
            
            // สุ่มเกิดไอเทมรอบๆ โรงเรียน
            spawnItems(10); 
        }

        // 4. ระบบติดตาม GPS
        function startGPS() {
            if ("geolocation" in navigator) {
                navigator.geolocation.watchPosition(updatePlayerPosition, handleLocationError, {
                    enableHighAccuracy: true,
                    maximumAge: 0,
                    timeout: 5000
                });
            } else {
                document.getElementById('status-text').innerText = "บราวเซอร์ไม่รองรับ GPS";
            }
        }

        function updatePlayerPosition(position) {
            const lat = position.coords.latitude;
            const lng = position.coords.longitude;
            playerLocation = L.latLng(lat, lng);

            document.getElementById('status-text').innerText = "พบสัญญาณ GPS แล้ว (ความแม่นยำ: " + Math.round(position.coords.accuracy) + "ม.)";

            if (!playerMarker) {
                // สร้างตัวผู้เล่นครั้งแรก
                playerMarker = L.marker([lat, lng], { icon: playerIcon, zIndexOffset: 1000 }).addTo(map);
                playerCircle = L.circle([lat, lng], { radius: CATCH_RADIUS, color: '#4f46e5', weight: 1, opacity: 0.5, fillColor: '#818cf8', fillOpacity: 0.2 }).addTo(map);
                map.setView([lat, lng], 19);
            } else {
                // อัปเดตตำแหน่ง
                playerMarker.setLatLng([lat, lng]);
                playerCircle.setLatLng([lat, lng]);
            }
        }

        function handleLocationError(error) {
            console.warn(`ERROR(${error.code}): ${error.message}`);
            document.getElementById('status-text').innerText = "กรุณาเปิด GPS และอนุญาตให้เว็บเข้าถึงตำแหน่ง";
        }

        function centerMapOnPlayer() {
            if (playerLocation) {
                map.setView(playerLocation, 19, { animate: true });
            }
        }

        // 5. ระบบสุ่มเกิดไอเทม (Spawning System)
        function spawnItems(amount) {
            for (let i = 0; i < amount; i++) {
                // สุ่มพิกัดรอบๆ ศูนย์กลางโรงเรียน (รัศมีประมาณ 100 เมตร)
                const latOffset = (Math.random() - 0.5) * 0.002;
                const lngOffset = (Math.random() - 0.5) * 0.002;
                const itemLat = SCHOOL_CENTER[0] + latOffset;
                const itemLng = SCHOOL_CENTER[1] + lngOffset;
                
                // สุ่มประเภทไอเทม
                const randomItem = itemTypes[Math.floor(Math.random() * itemTypes.length)];

                // สร้าง Icon แบบ Emoji
                const customIcon = L.divIcon({
                    html: `<div class="text-4xl drop-shadow-lg transform transition-transform hover:scale-110">${randomItem.icon}</div>`,
                    className: '',
                    iconSize: [40, 40],
                    iconAnchor: [20, 20]
                });

                // วางบนแผนที่
                const marker = L.marker([itemLat, itemLng], { icon: customIcon }).addTo(map);

                // ตรวจสอบระยะเมื่อคลิก
                marker.on('click', function() {
                    if (!playerLocation) {
                        alert("รอสัญญาณ GPS สักครู่...");
                        return;
                    }

                    // คำนวณระยะทางระหว่างผู้เล่นกับไอเทม
                    const itemLocation = marker.getLatLng();
                    const distance = map.distance(playerLocation, itemLocation);

                    if (distance <= CATCH_RADIUS) {
                        // เข้าสู่ Phase 2 (โหมด AR)
                        alert(`เจอแล้ว! ${randomItem.name}\nระยะห่าง: ${Math.round(distance)} เมตร\n\n>> กำลังเข้าสู่โหมดจับ (AR Canvas) <<`);
                        // marker.remove(); // ลบออกจากแผนที่เมื่อกดจับ (จะทำใน Phase 2)
                    } else {
                        alert(`คุณอยู่ไกลเกินไป!\nระยะห่าง: ${Math.round(distance)} เมตร\nต้องเข้าไปใกล้กว่า ${CATCH_RADIUS} เมตรถึงจะจับได้`);
                    }
                });
            }
        }

        // เริ่มทำงานเมื่อโหลดเว็บเสร็จ
        window.onload = initMap;
    </script>
</body>
</html>
